[package]
name = "miarina_bridge"
description = "Dart bridge (flutter_rust_bridge) to the Miarina Media Rust core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0"
flutter_rust_bridge = "=2.13.0"
serde.workspace = true
serde_json.workspace = true
storage = { path = "../../../crates/storage" }
# Library indexing (W-O1): the same crates as the Tauri app.
library = { path = "../../../crates/library" }
download-engine = { path = "../../../crates/download-engine" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "fs", "io-util", "macros", "sync", "time"] }
# Obtenir (download manager): the same crates as the Tauri app.
media-core = { path = "../../../crates/media-core" }
resource-manager = { path = "../../../crates/resource-manager" }
tokio-util = { version = "0.7.19", default-features = false }
# Built-in browser: addresses (same crate as the core and the Tauri app).
url.workspace = true
# App updates (plan R3): the same crates and versions as the Tauri app.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
ring = "0.17.14"
sha2 = "=0.11.1"

[features]
# Recette builds only (docs/app-updates.md): a loopback update server and a
# test key given at build time (MIARINA_UPDATE_TEST_BASE / _KEY).
update-test-channel = []

[lints.rust]
# flutter_rust_bridge's generated code uses this cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[target.'cfg(windows)'.dependencies]
# Torrents (Obtenir): the engine the Tauri app uses on Windows, vendored.
mdm-torrent = { path = "../../../vendor/misterdownloadmanager-source/crates/torrent" }
# Same versions as the Tauri app (apps/client/src-tauri/Cargo.toml).
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    # System media controls (api/system_media.rs).
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_Power",
    # Browser extension registration (extension.rs).
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
# TLS on Android uses the system trust store (rustls-platform-verifier needs
# the JVM handles, given by NativeBridge.initTls). Same versions as the
# Tauri app.
jni = "=0.22.4"
rustls-platform-verifier = "=0.7.1"

[dev-dependencies]
# Test-only: older or newer database files (same version as crates/storage).
rusqlite = { version = "0.40.2", features = ["bundled"] }
