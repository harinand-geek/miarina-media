# media.miarina.org : landing page de Miarina Media + téléchargements
# (Windows .exe, Android .apk). Site statique, sans appel externe.
# Sur le VPS : /www/server/panel/vhost/nginx/media.miarina.org.conf
server {
    listen 80;
    listen [::]:80;
    server_name media.miarina.org;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/media.miarina.org/acme;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.miarina.org;
    ssl_certificate     /etc/letsencrypt/live/media.miarina.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.miarina.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_miarinamedia:10m;
    ssl_session_timeout 1d;

    root /www/wwwroot/media.miarina.org/public_html;
    index index.html;

    # The page loads only its own files: nothing external, no inline code.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\.(?!well-known) { deny all; }

    # Versioned file names: long cache.
    location /assets/ {
        expires 30d;
        # Changed files get a new ?v= in the pages (Cloudflare caches by URL).
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /downloads/ {
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe;
        }
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/media.miarina.org.log;
    error_log /www/wwwlogs/media.miarina.org.error.log;
}
