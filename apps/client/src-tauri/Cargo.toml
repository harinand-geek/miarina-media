[package]
name = "miarina-media"
description = "Miarina Media desktop and mobile shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Desktop links the rlib; Android loads the cdylib.
name = "miarina_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
media-core = { path = "../../../crates/media-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.3", features = [] }
