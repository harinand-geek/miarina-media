[package]
name = "miarina-media"
description = "Miarina Media desktop and mobile shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# Desktop links the rlib; Android loads the cdylib.
name = "miarina_media_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Opt-in until crash recovery and native application validation are complete.
mdm-http = ["dep:miarina-mdm-adapter"]
# WIN-SPIKE prototype (lot L04): libVLC in the main window, measured. Never
# enabled in releases; see docs/decisions/0005-windows-player-engine.md.
libvlc-spike = [
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_System_LibraryLoader",
    "windows/Win32_System_ProcessStatus",
    "windows/Win32_System_Threading",
    "windows/Win32_UI_WindowsAndMessaging",
]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
ring = "0.17.14"
sha2 = "=0.11.1"
download-engine = { path = "../../../crates/download-engine" }
library = { path = "../../../crates/library" }
media-core = { path = "../../../crates/media-core" }
resource-manager = { path = "../../../crates/resource-manager" }
serde.workspace = true
serde_json.workspace = true
storage = { path = "../../../crates/storage" }
# `unstable`: several webviews in one window (built-in browser, decision 0001).
tauri = { version = "2.12.3", features = ["protocol-asset", "unstable"] }
# Called from Rust only; no plugin permission is granted to the frontend.
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tokio = { version = "1.53.2", features = ["sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }

[target.'cfg(windows)'.dependencies]
miarina-browser-bridge = { path = "../../../crates/browser-bridge" }
mdm-torrent = { path = "../../../vendor/misterdownloadmanager-source/crates/torrent" }
miarina-mdm-adapter = { path = "../../../crates/mdm-adapter", optional = true }
# Browser media detection through native WebView2 events. Already in the
# tree through wry; pinned to the same versions.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "android")'.dependencies]
# TLS on Android uses the system trust store (rustls-platform-verifier needs
# the JVM handles). Same versions as already resolved through reqwest/tao.
jni = "=0.22.4"
ndk-context = "=0.1.1"
rustls-platform-verifier = "=0.7.1"
