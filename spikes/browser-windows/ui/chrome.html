<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chrome</title>
<link rel="stylesheet" href="spike.css">
<script src="chrome.js" defer></script>
</head>
<body class="chrome">
  <button id="back" title="Back · Alt+←" aria-label="Back">←</button>
  <button id="forward" title="Forward · Alt+→" aria-label="Forward">→</button>
  <button id="reload" title="Reload · F5" aria-label="Reload">⟳</button>
  <form id="bar" class="address">
    <input id="address" aria-label="Address" spellcheck="false" autocomplete="off">
    <span id="chip" class="chip" hidden></span>
  </form>
  <span id="status" class="status" role="status"></span>
</body>
</html>
