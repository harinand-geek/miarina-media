[package]
name = "browser-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 4 feasibility spike: embedded browser on Windows. Not shipped."

# Standalone on purpose: the `unstable` Tauri feature must never leak into the app build.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["unstable"] }

[target.'cfg(windows)'.dependencies]
# Already in the dependency tree through wry; pinned to the same versions.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
