document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 <sc-if value=\"{{ isDownloading }}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:8px;background:var(--bg);border:1px solid var(--line)\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:700\"><span>{{ selName }}<\u002Fspan><span style=\"font:500 12.5px 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums\">{{ pctLabel }}<\u002Fspan><\u002Fdiv>\n          <div style=\"height:4px;border-radius:2px;background:var(--line);overflow:hidden\"><div style=\"height:100%;background:var(--accent);transition:width .1s linear;width:{{ pctWidth }}\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font:500 12px 'JetBrains Mono',monospace;color:var(--muted)\">{{ selSize }} · 6,4 Mo/s · reprise automatique si la connexion coupe<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDone }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:8px;background:var(--sel-bg);border:1px solid var(--accent)\">\n          <div style=\"display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700\"><span style=\"font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:22px;color:var(--accent-text);font-weight:normal;letter-spacing:normal;white-space:nowrap;display:inline-block\">check<\u002Fspan>Enregistré dans la bibliothèque<\u002Fdiv>\n          <span style=\"font:500 12px 'JetBrains Mono',monospace;color:var(--muted);overflow-wrap:anywhere\">{{ folder }}\\{{ selName }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ reset }}\" style=\"align-self:flex-start;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font:600 13px Manrope,sans-serif;cursor:pointer\">Recommencer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"fonctions\" style=\"border-top:1px solid var(--line);scroll-margin-top:{{ scrollPad }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(56px,9vw,88px) clamp(16px,4vw,56px);display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:720px\">\n      <span style=\"font:500 12px 'JetBrains Mono',monospace;color:var(--accent-text)\">Fonctionnalités<\u002Fspan>\n      <h2 style=\"font-size:clamp(32px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.04\">Du lien au fichier, en trois gestes.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));column-gap:56px\">\n      <div style=\"display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)\"><span style=\"flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:22px\">link<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:16.5px\">Collez un lien<\u002Fstrong><span style=\"font-size:14.5px;line-height:1.6;color:var(--muted)\">Miarina Media lit l’adresse et vous montre ce qui peut être téléchargé.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)\"><span style=\"flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:22px\">tune<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:16.5px\">Choisissez le format<\u002Fstrong><span style=\"font-size:14.5px;line-height:1.6;color:var(--muted)\">Qualité vidéo ou audio seul, avec la taille du fichier affichée avant de lancer.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)\"><span style=\"flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:22px\">download<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:16.5px\">File de téléchargements<\u002Fstrong><span style=\"font-size:14.5px;line-height:1.6;color:var(--muted)\">Mettez en pause, reprenez plus tard. Si la connexion coupe, le téléchargement repart tout seul.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)\"><span style=\"flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-subtle);color:var(--accent-text);display:grid;place-items:center;font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:22px\">speed<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:16.5px\">Éco, Équilibré, Performance<\u002Fstrong><span style=\"font-size:14.5px;line-height:1.6;color:var(--muted)\">Réglez combien de téléchargements tournent en même temps, selon votre machine.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)\"><span style=\"flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-subtle);color:var(--accent-text);display:grid;place-items:center;font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:22px\">video_library<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:16.5px\">Bibliothèque<\u002Fstrong><span style=\"font-size:14.5px;line-height:1.6;color:var(--muted)\">Vos fichiers rangés par vidéo et audio, avec une recherche, des miniatures et la durée.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)\"><span style=\"flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-subtle);color:var(--accent-text);display:grid;place-items:center;font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:22px\">contrast<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font-size:16.5px\">Clair ou sombre<\u002Fstrong><span style=\"font-size:14.5px;line-height:1.6;color:var(--muted)\">Thème sombre par défaut, thème clair et mode système.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"navigateur\" style=\"background:#101820;color:#F5F7FA;scroll-margin-top:{{ scrollPad }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(56px,9vw,96px) clamp(16px,4vw,56px);display:flex;flex-direction:column;gap:40px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px 56px;align-items:flex-end;justify-content:space-between\">\n      <div style=\"flex:1 1 min(100%,420px);display:flex;flex-direction:column;gap:16px;max-width:640px\">\n        <span style=\"font:500 12px 'JetBrains Mono',monospace;color:#35C9BD\">Navigateur intégré<\u002Fspan>\n        <h2 style=\"font-size:clamp(32px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.04;text-wrap:balance\">Naviguez. Le bouton apparaît quand il y a quelque chose à garder.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"flex:1 1 min(100%,320px);max-width:440px;font-size:15.5px;line-height:1.65;color:#94A3B8;text-wrap:pretty\">Sous Windows comme sous Android, tapez une adresse ou une recherche : dès qu’une page contient une vidéo ou un son, un bouton de téléchargement apparaît au-dessus de la barre. Sur Android, seuls les fichiers vidéo et audio d’une page sont proposés pour l’instant.<\u002Fp>\n    <\u002Fdiv>\n    <figure style=\"margin:0;border-radius:12px;border:1px solid #2A3D4E;background:#0D141B;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.5)\">\n      <img src=\"2de24315-b79a-4652-bccc-a68113a6a982\" width=\"1280\" height=\"800\" loading=\"lazy\" alt=\"Navigateur intégré sous Windows : page Wikimedia Commons et bouton « Download · 5 »\" style=\"display:block;width:100%;height:auto\">\n    <\u002Ffigure>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n      <span style=\"height:30px;padding:0 12px;border-radius:15px;background:#1F3A3C;border:1px solid #2E6A68;color:#5FE0D5;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px\"><span style=\"font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:16px\">check<\u002Fspan>Détection des médias de la page<\u002Fspan>\n      <span style=\"height:30px;padding:0 12px;border-radius:15px;background:#1F3A3C;border:1px solid #2E6A68;color:#5FE0D5;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px\"><span style=\"font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:16px\">check<\u002Fspan>Bouton de téléchargement flottant<\u002Fspan>\n      <span style=\"height:30px;padding:0 12px;border-radius:15px;background:#1F3A3C;border:1px solid #2E6A68;color:#5FE0D5;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px\"><span style=\"font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:16px\">check<\u002Fspan>Choix du format sans quitter la page<\u002Fspan>\n      <span style=\"height:30px;padding:0 12px;border-radius:15px;background:#1F3A3C;border:1px solid #2E6A68;color:#5FE0D5;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px\"><span style=\"font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:16px\">check<\u002Fspan>Recherche et favoris<\u002Fspan>\n      <span style=\"height:30px;padding:0 12px;border-radius:15px;background:#2B2616;border:1px solid #4A3F1F;color:#E8B04B;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px\"><span style=\"font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:16px\">schedule<\u002Fspan>Onglets et historique : bientôt<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"formats\" style=\"scroll-margin-top:{{ scrollPad }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(56px,9vw,96px) clamp(16px,4vw,56px);display:flex;flex-wrap:wrap;gap:40px 64px;align-items:flex-start\">\n    <div style=\"flex:1 1 min(100%,320px);display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 12px 'JetBrains Mono',monospace;color:var(--accent-text)\">Formats et qualités<\u002Fspan>\n      <h2 style=\"font-size:clamp(32px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.04;text-wrap:balance\">Vous choisissez la qualité. Nous affichons la taille avant.<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.65;color:var(--muted)\">Seuls les formats réellement proposés par la source sont listés.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1.2 1 min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;gap:24px;border-bottom:1px solid var(--line)\">\n        <sc-for list=\"{{ specTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.pick }}\" style=\"height:40px;padding:0;border:0;background:none;font:600 13.5px Manrope,sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:-1px;color:{{ t.color }};border-bottom:2px solid {{ t.line }}\"><span style=\"font-family:Icons;font-feature-settings:'liga';line-height:1;font-size:18px\">{{ t.icon }}<\u002Fspan>{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ specRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:14.5px\">\n            <span style=\"font-weight:600\">{{ r.label }}<\u002Fspan>\n            <sc-if value=\"{{ r.soon }}\"><span style=\"color:var(--planned);font-size:13px;font-weight:600\">Bientôt<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ r.notSoon }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font:500 12.5px 'JetBrains Mono',monospace;color:var(--muted);text-align:right\">{{ r.detail }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bibliotheque\" style=\"background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);scroll-margin-top:{{ scrollPad }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(56px,9vw,96px) clamp(16px,4vw,56px);display:flex;flex-wrap:wrap;gap:48px;align-items:center\">\n    <figure style=\"flex:1.6 1 min(100%,480px);min-width:0;margin:0;border-radius:12px;border:1px solid var(--line2);background:#0D141B;overflow:hidden;box-shadow:0 24px 64px var(--shadow)\">\n      <img src=\"2dfb2a31-f302-4790-b30f-96a3f31f1cdd\" width=\"1280\" height=\"800\" loading=\"lazy\" alt=\"Bibliothèque sous Windows : bandes-annonces sous licence libre avec miniatures, qualité et durée\" style=\"display:block;width:100%;height:auto\">\n    <\u002Ffigure>\n    <div style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font:500 12px 'JetBrains Mono',monospace;color:var(--accent-text)\">Bibliothèque et lecteur<\u002Fspan>\n      <h2 style=\"font-size:clamp(30px,3.4vw,44px);font-weight:800;letter-spacing:-.04em;line-height:1.05\">Tout ce que vous gardez, au même endroit.<\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.65;color:var(--muted);text-wrap:pretty\">Les fichiers téléchargés arrivent dans la bibliothèque, triés par vidéo et audio. Sous Windows, le lecteur intégré gère la vitesse, le plein écran, l’image dans l’image et reprend là où vous vous étiez arrêté. Rien ne nécessite de connexion.<\u002Fp>\n      <p style=\"font-size:13.5px;line-height:1.6;color:var(--muted);text-wrap:pretty\">Sur Android, le lecteur intégré gère la lecture, la vitesse et la reprise ; le plein écran et l’image dans l’image arrivent dans une prochaine version.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"confidentialite\" style=\"scroll-margin-top:{{ scrollPad }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(56px,9vw,96px) clamp(16px,4vw,56px);display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:500 12px 'JetBrains Mono',monospace;color:var(--accent-text)\">Confidentialité<\u002Fspan>\n      <h2 style=\"font-size:clamp(32px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.04\">Sans publicité. Sans compte. Sans pistage.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0;border-top:2px solid var(--fg)\">\n      <div style=\"padding:24px 24px 0 0;display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:clamp(72px,8vw,120px);font-weight:800;letter-spacing:-.06em;line-height:.9;color:var(--accent-text)\">0<\u002Fspan><strong style=\"font-size:17px\">publicité<\u002Fstrong><span style=\"font-size:14px;line-height:1.55;color:var(--muted)\">Ni dans l’application, ni dans l’installateur.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:24px 24px 0 0;display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:clamp(72px,8vw,120px);font-weight:800;letter-spacing:-.06em;line-height:.9;color:var(--accent-text)\">0<\u002Fspan><strong style=\"font-size:17px\">compte<\u002Fstrong><span style=\"font-size:14px;line-height:1.55;color:var(--muted)\">Rien à créer pour utiliser l’application.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:24px 24px 0 0;display:flex;flex-direction:col --fg)\">Licences<\u002Fa>\n      <span style=\"color:var(--muted)\">© 2026 MIARINA<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;}}\">\nconst THEMES = {\n  light: {'--bg':'#F6F8FA','--surface':'#FFFFFF','--surface2':'#EEF2F5','--sidebar':'#EDF1F4','--line':'#DDE3E9','--line2':'#C9D2DB','--fg':'#101820','--muted':'#526072','--faint':'#64748B','--body2':'#2B3A4A','--accent-text':'#0F8579','--accent-subtle':'#DDF5F2','--chip':'#9ADFD8','--planned':'#A86F0A','--sel-bg':'#EAF8F6','--logo-tile':'#101820','--logo-glyph':'#35C9BD','--shadow':'rgba(16,24,32,.12)','--stripe':'rgba(16,24,32,.06)'},\n  dark: {'--bg':'#101820','--surface':'#182530','--surface2':'#1F2F3B','--sidebar':'#0D141B','--line':'#243545','--line2':'#2A3D4E','--fg':'#F5F7FA','--muted':'#94A3B8','--faint':'#64748B','--body2':'#C9D4E0','--accent-text':'#35C9BD','--accent-subtle':'#1F3A3C','--chip':'#2E6A68','--planned':'#E8B04B','--sel-bg':'#16302F','--logo-tile':'#35C9BD','--logo-glyph':'#101820','--shadow':'rgba(0,0,0,.45)','--stripe':'rgba(255,255,255,.05)'}\n};\nconst NAV = [['telecharger','download','Télécharger'],['fonctions','tune','Fonctionnalités'],['navigateur','link','Navigateur'],['formats','movie','Formats'],['bibliotheque','video_library','Bibliothèque'],['confidentialite','visibility_off','Confidentialité'],['plateformes','desktop_windows','Plateformes'],['faq','add','FAQ'],['versions','schedule','Versions']];\nconst DEMO = {\n  video: [['1080p','MP4 · H.264','372 Mo',true,'Tears of Steel.mp4'],['720p','MP4 · H.264','186 Mo',false,'Tears of Steel.mp4'],['1080p','WebM · VP9','298 Mo',false,'Tears of Steel.webm']],\n  audio: [['MP3','320 kbps','28 Mo',true,'Tears of Steel.mp3'],['MP3','128 kbps','11 Mo',false,'Tears of Steel.mp3'],['FLAC','sans perte','112 Mo',false,'Tears of Steel.flac']]\n};\nconst SPEC = {\n  video: [['Jusqu’à 4K','si la source le propose'],['MP4','H.264'],['WebM','VP9'],['Fichier original','lien direct']],\n  audio: [['MP3 · 320, 256, 192 ou 128 kbps','conversion · Windows'],['FLAC','conversion · Windows'],['Piste audio d’origine','selon la source'],['Fichier original','lien direct']],\n  subs: [['SRT','',true]]\n};\nconst FAQ = [\n  ['Miarina Media est-il gratuit ?', 'Oui. L’application est gratuite, sans publicité et sans compte.'],\n  ['Quels sites sont pris en charge ?', 'Les liens directs vers un fichier vidéo ou audio fonctionnent sur Windows et Android. Sous Windows, les pages de nombreux sites vidéo sont analysées avec yt-dlp, inclus dans l’installateur avec FFmpeg et QuickJS-NG : rien à télécharger en plus. Les contenus privés, protégés par connexion ou par DRM, et les diffusions en direct ne sont pas pris en charge.'],\n  ['Ai-je le droit de télécharger ces contenus ?', 'Cela dépend du contenu et de sa licence. Téléchargez uniquement ce que vous avez le droit de conserver, par exemple des œuvres sous licence libre, dans le domaine public, ou vos propres contenus.'],\n  ['Où sont enregistrés les fichiers ?', 'Sous Windows, dans le dossier choisi dans les réglages (par défaut Vidéos\\\\Miarina). Sous Android 11 et plus, les vidéos vont dans Films/Miarina et l’audio dans Musique/Miarina : ils apparaissent dans la galerie et restent sur le téléphone si vous désinstallez l’application. Sous Android 7 à 10, ils restent pour l’instant dans l’espace de l’application.'],\n  ['Faut-il une connexion pour lire mes fichiers ?', 'Non. La bibliothèque et le lecteur fonctionnent hors ligne, sous Windows comme sous Android.'],\n  ['Pourquoi Windows affiche-t-il un avertissement ?', 'Cette préversion n’est pas encore signée numériquement, donc Windows SmartScreen peut afficher « Windows a protégé votre ordinateur ». Comparez l’empreinte SHA-256 du fichier avec celle indiquée sur cette page, puis choisissez « Informations complémentaires » et « Exécuter quand même ».'],\n  ['Comment installer l’APK sur Android ?', 'Ouvrez le fichier téléchargé : Android vous demandera d’autoriser l’installation depuis votre navigateur la première fois. Les versions publiées ici sont toutes signées avec la même clé : les mises à jour s’installent par-dessus la version précédente. Si vous aviez installé l’APK du tout premier test (avant le 15 octobre 2026), désinstallez-le une fois avant d’installer celui-ci.']\n];\nconst CHANGELOG = [\n  {name:'Prochaines',date:'En préparation',planned:true,items:['Navigateur : plusieurs onglets et historique','Android : pages de sites vidéo (YouTube…)','Android : lecture audio en arrière-plan, plein écran et image dans l’image']},\n  {name:'0.1.3',date:'Préversion de test · 18 octobre 2026',current:true,items:['Android : navigateur intégré, avec recherche, raccourcis et bouton de téléchargement quand la page contient un fichier vidéo ou audio','Windows : le navigateur s’ouvre dans la fenêtre principale, avec la même présentation que sur Android','Windows et Android : favoris dans le navigateur (étoile dans la barre d’adresse)','Windows et Android : des mots tapés dans le champ de l’accueil lancent une recherche dans le navigateur','Windows et Android : la meilleure copie jusqu’à 1080p est proposée en premier quand une page en contient plusieurs','Lecteur : fond flou tiré de la vidéo en cours, ou de la pochette pour l’audio']},\n  {name:'0.1.2',date:'Préversion de test · 18 octobre 2026',items:['Windows : correction des téléchargements dont le titre contient des accents','Windows : yt-dlp se met à jour tout seul (une fois par jour au plus, signature vérifiée)','Android : lecteur intégré, miniatures et durées','Android : fichiers dans Films et Musique, visibles dans la galerie (Android 11+)','Android : téléchargements en arrière-plan avec notification (Pause, Annuler) et « Téléchargement terminé »','Android : partager un lien vers l’app, partager ou ouvrir un fichier avec une autre app','Android : nouvelle icône et écran de démarrage']},\n  {name:'0.1.1',date:'Préversion de test · 17 octobre 2026',items:['Windows : yt-dlp, FFmpeg et QuickJS-NG inclus dans l’installateur, plus rien à télécharger au premier usage','Windows : téléchargements YouTube plus rapides','Windows : MP3 en 320, 256, 192 ou 128 kbps, et FLAC','Windows : miniature affichée dès l’analyse et pendant le téléchargement','Windows et Android : message plus clair quand un lien est incomplet, avec ajout de « https:// » en un geste']},\n  {name:'0.1.0',date:'Préversion de test · 14 octobre 2026',items:['Première préversion Windows et Android','Analyse de lien, choix du format, file de téléchargements avec reprise','Windows : pages de sites vidéo (yt-dlp), conversion MP3, bibliothèque avec miniatures, lecteur, navigateur intégré']}\n];\nconst PLATFORMS = [\n  ['Téléchargement par lien direct',true,true],['Pages de sites vidéo (via yt-dlp)',true,'soon'],['Conversion en MP3',true,'soon'],['File, pause et reprise',true,true],['Bibliothèque',true,true],['Lecteur intégré',true,true],['Image dans l’image',true,'soon'],['Téléchargement en arrière-plan, notifications',true,true],['Navigateur intégré, recherche et favoris',true,true],['Détection dans le navigateur','Fichiers et pages','Fichiers vidéo et audio'],['Partager un lien vers l’app',false,true],['Partager ou ouvrir un fichier avec une autre app',false,true],['Fichiers visibles dans la galerie (Android 11+)',false,true],['Raccourcis clavier',true,false],['Configuration minimale','Windows 10 · 64 bits','Android 7.0']\n];\nconst cell = v => ({yes:v===true,no:v===false,soon:v==='soon',isText:typeof v==='string'&&v!=='soon',text:typeof v==='string'?v:''});\nconst KEY = 'mm-landing-v3-theme';\n\nclass Component extends DCLogic {\n  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, menu: false, theme: 'light', step: 'idle', tab: 'video', sel: 0, pct: 0, spec: 'video', plat: 'all', open: 0, active: 'telecharger' };\n  componentDidMount() {\n    let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}\n    this._lastProp = this.props.theme;\n    const t = saved || this.props.theme || 'light';\n    this.apply(t); this.setState({ theme: t });\n    this._onScroll = () => {\n      let cur = 'telecharger';\n      for (const [id] of NAV) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) cur = id; }\n      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = 'versions';\n      if (cur !== this.state.active) this.setState({ active: cur });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onResize = () => { const w = window.innerWidth; if (w !== this.state.w) this.setState({ w, menu: w < 900 ? this.state.menu : false }); };\n    window.addEventListener('resize', this._onResize);\n    setTimeout(() => this.readLog(document.querySelector('[data-mm3-log]')), 300);\n  }\n  componentDidUpdate() {\n    const p = this.props.theme;\n    if (p && p !== this._lastProp) { this._lastProp = p; this.apply(p); this.setState({ theme: p }); }\n  }\n  componentWillUnmount() { window.removeEventListener('scroll', this._onScroll); window.removeEventListener('resize', this._onResize); clearInterval(this._iv); clearTimeout(this._to); }\n  apply(t) {\n    const el = document.querySelector('[data-mm3-root]'); if (!el) return;\n    const v = THEMES[t] || THEMES.light;\n    for (const k in v) el.style.setProperty(k, v[k]);\n    document.body.style.background = v['--bg'];\n  }\n  analyze = () => {\n    clearInterval(this._iv); clearTimeout(this._to);\n    this.setState({ step: 'analyzing', pct: 0 });\n    this._to = setTimeout(() => this.setState({ step: 'formats', tab: 'video', sel: 0 }), 900);\n  };\n  startDownload = () => {\n    this.setState({ step: 'downloading', pct: 0 });\n    clearInterval(this._iv);\n    this._iv = setInterval(() => {\n      const p = Math.min(100, this.state.pct + 2.5);\n      if (p >= 100) { clearInterval(this._iv); this.setState({ pct: 100, step: 'done' }); }\n      else this.setState({ pct: p });\n    }, 80);\n  };\n  readLog(el) {\n    if (!el) return;\n    const max = el.scrollHeight - el.clientHeight;\n    const ratio = el.clientHeight / el.scrollHeight;\n    const blocks = [...((el.firstElementChild || {}).children || [])];\n    const passed = blocks.filter(b => b.offsetTop + b.offsetHeight <= el.scrollTop + el.clientHeight).length;\n    const log = { r: Math.min(1, ratio), p: max > 0 ? el.scrollTop / max : 1, more: max > 0 && el.scrollTop < max - 8, left: Math.max(0, CHANGELOG.length - passed) };\n    const o = this.state.log || {};\n    if (o.r !== log.r || o.p !== log.p || o.more !== log.more || o.left !== log.left) this.setState({ log });\n  }\n  logVals() {\n    const l = this.state.log || { r: .35, p: 0, more: true, left: 4 };\n    const h = Math.max(12, l.r * 100);\n    return {\n      logThumbH: h + '%', logThumbTop: (l.p * (100 - h)) + '%', logMore: l.more,\n      logLeft: '+' + l.left,\n      onLogScroll: e => this.readLog(e.currentTarget),\n      logNext: () => { const el = document.querySelector('[data-mm3-log]'); if (el) el.scrollBy({ top: 320, behavior: 'smooth' }); }\n    };\n  }\n  renderVals() {\n    const s = this.state, theme = s.theme;\n    const rows = DEMO[s.tab], cur = rows[s.sel] || rows[0];\n    const seg = (on) => ({ bg: on ? 'var(--surface2)' : 'transparent', color: on ? 'var(--fg)' : 'var(--muted)' });\n    const platFilter = ([, w, a]) => s.plat === 'all' || (s.plat === 'windows' ? w !== false : a !== false);\n    const narrow = s.w < 900;\n    return {\n      wide: !narrow, narrow, showBrandText: s.w >= 400, showDlText: s.w >= 360,\n      colW: s.w < 520 ? '' : 'Windows', colA: s.w < 520 ? '' : 'Android', scrollPad: narrow ? '56px' : '0px',\n      menuOpen: s.menu, menuClosed: !s.menu, menuOpenStr: s.menu ? 'true' : 'false',\n      toggleMenu: () => this.setState(st => ({ menu: !st.menu })),\n      closeMenu: () => { if (this.state.menu) this.setState({ menu: false }); },\n      themeLabel: theme === 'dark' ? 'clair' : 'sombre',\n      toggleTheme: () => { const t = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem(KEY, t); } catch (e) {} this.apply(t); this.setState({ theme: t }); },\n      nav: NAV.map(([id, icon, label]) => ({ href: '#' + id, icon, label, active: s.active === id, inactive: s.active !== id })),\n      stepLabel: { idle: '1 · lien', analyzing: '1 · analyse', formats: '2 · format', downloading: '3 · fichier', done: '3 · terminé' }[s.step],\n      isIdle: s.step === 'idle', isAnalyzing: s.step === 'analyzing', isFormats: s.step === 'formats', isDownloading: s.step === 'downloading', isDone: s.step === 'done',\n      showMedia: ['formats', 'downloading', 'done'].includes(s.step),\n      analyze: this.analyze, startDownload: this.startDownload,\n      reset: () => this.setState({ step: 'idle', pct: 0 }),\n      tabs: [['video', 'Vidéo'], ['audio', 'Audio seul']].map(([k, label]) => ({ label, ...seg(s.tab === k), pick: () => this.setState({ tab: k, sel: 0 }) })),\n      formats: rows.map(([q, codec, size, rec], i) => {\n        const on = i === s.sel;\n        return { q, codec, size, rec, recShow: rec && s.w >= 520, border: on ? 'var(--accent)' : 'var(--line)', bg: on ? 'var(--sel-bg)' : 'transparent', ring: on ? 'var(--accent)' : 'var(--line2)', dot: on ? 'var(--accent)' : 'transparent', pick: () => this.setState({ sel: i }) };\n      }),\n      folder: s.tab === 'audio' ? 'Musique\\\\Miarina' : 'Vidéos\\\\Miarina',\n      selSize: cur[2], selName: cur[4],\n      pctLabel: Math.round(s.pct) + ' %', pctWidth: s.pct + '%',\n      specTabs: [['video', 'movie', 'Vidéo'], ['audio', 'music_note', 'Audio'], ['subs', 'closed_caption', 'Sous-titres']].map(([k, icon, label]) => ({ icon, label, color: s.spec === k ? 'var(--fg)' : 'var(--muted)', line: s.spec === k ? 'var(--accent)' : 'transparent', pick: () => this.setState({ spec: k }) })),\n      specRows: SPEC[s.spec].map(([label, detail, soon]) => ({ label, detail, soon: !!soon, notSoon: !soon })),\n      platTabs: [['all', 'Tout'], ['windows', 'Windows'], ['android', 'Android']].map(([k, label]) => ({ label, bg: s.plat === k ? 'var(--surface)' : 'transparent', color: s.plat === k ? 'var(--fg)' : 'var(--muted)', pick: () => this.setState({ plat: k }) })),\n      platforms: PLATFORMS.filter(platFilter).map(([feature, w, a]) => ({ feature, cells: [cell(w), cell(a)] })),\n      faq: FAQ.map(([question, answer], i) => ({ question, answer, open: s.open === i, closed: s.open !== i, toggle: () => this.setState(st => ({ open: st.open === i ? -1 : i })) })),\n      ...this.logVals(),\n      changelog: CHANGELOG.map(r => ({ ...r, planned: !!r.planned, current: !!r.current, past: !r.planned && !r.current }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
